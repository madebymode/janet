<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Janet</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Janet Stats</h1>
        </div>
    </div>
    
    <nav class="nav">
        <div class="container">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/leaderboard">Leaderboard</a></li>
                <li><a href="/stats">Statistics</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {{template "content" .}}
    </div>

    <script src="/static/js/main.js"></script>
    {{if .ExtraJS}}
        {{range .ExtraJS}}
            <script src="{{.}}"></script>
        {{end}}
    {{end}}
</body>
</html>
