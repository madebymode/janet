services:
  # PostgreSQL Database
  postgres:
    image: postgres:alpine
    container_name: janet-postgres
    environment:
      POSTGRES_DB: janet
      POSTGRES_USER: janet
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migration.sql:/docker-entrypoint-initdb.d/migration.sql
    networks:
      - janet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janet -d janet"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Database Migration (one-time setup)
  migrate:
    build:
      context: .
      dockerfile: ./cmd/migrate/Dockerfile
    container_name: janet-migrate
    environment:
      JANET_DATABASE_URL: postgres://janet:password@postgres:5432/janet?sslmode=disable
      RUN_MIGRATIONS: "true"
    volumes:
      - ./database/migration.sql:/app/database/migration.sql:ro
      - ./2022.db.sqlite3:/app/2022.db.sqlite3:ro
      - ./2023.db.sqlite3:/app/2023.db.sqlite3:ro
      - ./2024.db.sqlite3:/app/2024.db.sqlite3:ro
      - ./2025.db.sqlite3:/app/2025.db.sqlite3:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - janet-network
    restart: "no"  # Run once

  # Dedicated Slack Bot Service
  janet-bot:
    build:
      context: .
      dockerfile: ./cmd/janet-bot/Dockerfile
    container_name: janet-bot
    environment:
      # Database
      JANET_DATABASE_DRIVER: postgres
      JANET_DATABASE_URL: postgres://janet:password@postgres:5432/janet?sslmode=disable
      
      # Slack Configuration (set these in .env file)
      JANET_SLACK_TOKEN: ${JANET_SLACK_TOKEN}
      JANET_SLACK_SOCKET_TOKEN: ${JANET_SLACK_SOCKET_TOKEN}
      JANET_GOOD_PLACE_JUDGE_BOT_ID: ${JANET_GOOD_PLACE_JUDGE_BOT_ID}
      
      # Bot Behavior
      JANET_MAX_POINTS: 5
      JANET_LEADERBOARD_LIMIT: 10
      JANET_REPLY_TYPE: message
      JANET_DEBUG: true
      JANET_SELF_KARMA: false
      JANET_MOTIVATE: true
      JANET_REACTJI_ENABLED: true
      
      # Bot Personalities
      JANET_GOOD_USERNAME: "Good Janet"
      JANET_GOOD_ICON_URL: ""
      JANET_BAD_USERNAME: "Bad Janet"
      JANET_BAD_ICON_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - janet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "janet-bot"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web UI Service (without bot functionality)
  janet-web:
    build:
      context: .
      dockerfile: ./janet-server/Dockerfile
    container_name: janet-web
    environment:
      # Database
      JANET_DATABASE_DRIVER: postgres
      JANET_DATABASE_URL: postgres://janet:password@postgres:5432/janet?sslmode=disable
      
      # Web Configuration
      JANET_WEB_LISTEN_ADDR: 0.0.0.0:8080
      JANET_WEB_PASSWORD: ${JANET_WEB_PASSWORD:-admin123}
      JANET_WEB_PUBLIC_URL: http://localhost:8080
      
      # Disable bot functionality in web service
      JANET_BOT_ENABLED: "false"
      
      # Slack API access needed for backfill operations and admin features
      JANET_SLACK_TOKEN: ${JANET_SLACK_TOKEN}
      JANET_SLACK_SOCKET_TOKEN: ${JANET_SLACK_SOCKET_TOKEN}
      JANET_GOOD_PLACE_JUDGE_BOT_ID: ${JANET_GOOD_PLACE_JUDGE_BOT_ID}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - janet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  janet-network:
    driver: bridge

volumes:
  postgres_data:
