<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Janet</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Janet Admin Login</h1>
        </div>
    </div>

    <div class="container" style="max-width: 400px; margin-top: 2rem;">
        <div class="card">
            <h2>Administrator Access</h2>
            <form action="/admin/login" method="POST">
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required autofocus>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
            
            {{if .Error}}
            <div class="alert alert-error" style="margin-top: 1rem;">
                {{.Error}}
            </div>
            {{end}}
        </div>
        
        <div class="card">
            <h3>About</h3>
            <p>This is the administration interface for Janet, the Good Place Judge bot. 
            Administrator access is required to manage configuration, run backfills, and monitor the system.</p>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/" class="btn" style="background: #95a5a6;">Back to Public View</a>
            </div>
        </div>
    </div>
</body>
</html>
